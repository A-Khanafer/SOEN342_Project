erif" font-size="14" lengthAdjust="spacing" textLength="165.0332" x="281.625" y="263.4795">status: OPEN / BOOKED</text></g><g class="entity" data-entity="GMN15" data-source-line="43" data-uid="ent0016" id="entity_GMN15"><path d="M21.125,567.2969 L21.125,652.9609 A0,0 0 0 0 21.125,652.9609 L411.1841,652.9609 A0,0 0 0 0 411.1841,652.9609 L411.1841,577.2969 L401.1841,567.2969 L220.125,567.2969 L216.125,530.347 L212.125,567.2969 L21.125,567.2969 A0,0 0 0 0 21.125,567.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M401.1841,567.2969 L401.1841,577.2969 L411.1841,577.2969 L401.1841,567.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.4453" x="27.125" y="584.3638">Each resource is one predefined unit.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.9917" x="27.125" y="599.4966">Requirements restrict allowed units, kind and quantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.0591" x="27.125" y="614.6294">Human resources represent roles, not named personnel.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.1914" x="27.125" y="629.7622">Units cannot have overlapping active allocations.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.6797" x="27.125" y="644.895">Cancellation breaks allocation links, freeing the units.</text></g><g class="link" data-entity-1="MedicalService" data-entity-2="ResourceRequirement" data-uid="lnk8" id="link_MedicalService_ResourceRequirement"><path d="M109.744,262.6763 C105.7205,284.9605 100.8077,312.1696 97.039,333.0423" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.5615" x="107