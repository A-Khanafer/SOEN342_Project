<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="940px" height="666px" viewBox="0 0 940 666" xmlns:c2pa="http://c2pa.org/manifest"><rect width="100%" height="100%" fill="#fff"/><text x="30" y="34" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">SSD UC1-S: Request Appointment, main success scenario M1-M8 (SO01, SO26, SO02)</text><line x1="170" y1="105" x2="170" y2="651" stroke="#000" stroke-dasharray="3 3"/><circle cx="170" cy="57" r="8" fill="#fff" stroke="#000"/><line x1="170" y1="65" x2="170" y2="85" stroke="#000"/><line x1="155" y1="71" x2="185" y2="71" stroke="#000"/><path d="M155 105 L170 85 L185 105" fill="none" stroke="#000"/><rect x="635" y="45" width="170" height="40" fill="#fff" stroke="#000"/><line x1="720.0" y1="85" x2="720.0" y2="651" stroke="#000" stroke-dasharray="3 3"/><path d="M80 140 H808 L820 152 V178 H80 Z" fill="#fff2cc" stroke="#d6b656"/><path d="M808 140 V152 H820" fill="none" stroke="#d6b656"/><text x="88.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">Context: Administrative Staff identified. The Patient is at the front desk or on the phone (supporting actor, talks to</text><text x="88.0" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">the staff, not to the System).</text><text x="445.0" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">m1: startBooking(patientKey)</text><line x1="170" y1="214" x2="719.0" y2="214" stroke="#000"/><path d="M720.0 214 L710.0 210 L710.0 218 Z" fill="#000"/><path d="M80 240 H808 L820 252 V264 H80 Z" fill="#fff2cc" stroke="#d6b656"/><path d="M808 240 V252 H820" fill="none" stroke="#d6b656"/><text x="88.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">SO01 (M1). patientKey = the Patient&#x27;s phone number or patient number.</text><text x="445.0" y="294.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">patient (name, patient number)</text><line x1="720.0" y1="300" x2="170" y2="300" stroke="#000" stroke-dasharray="4 3"/><path d="M180 296 L170 300 L180 304" fill="none" stroke="#000"/><text x="445.0" y="378.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">m2: searchAvailability(criteria)</text><line x1="170" y1="384" x2="719.0" y2="384" stroke="#000"/><path d="M720.0 384 L710.0 380 L710.0 388 Z" fill="#000"/><path d="M104 410 H784 L796 422 V434 H104 Z" fill="#fff2cc" stroke="#d6b656"/><path d="M784 410 V422 H796" fill="none" stroke="#d6b656"/><text x="112.0" y="426.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">SO26 (Part B). criteria = optional professional, specialty, fromDate, toDate; empty = any.</text><text x="445.0" y="464.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">open TimeSlots, sorted by date and start time</text><line x1="720.0" y1="470" x2="170" y2="470" stroke="#000" stroke-dasharray="4 3"/><path d="M180 466 L170 470 L180 474" fill="none" stroke="#000"/><rect x="90" y="326" width="720" height="170" fill="none" stroke="#000" stroke-dasharray="4 3"/><path d="M90 326 H136 V340 L130 346 H90 Z" fill="#fff" stroke="#000"/><text x="96.0" y="340.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold">loop</text><text x="142.0" y="358.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">[until a TimeSlot is agreed with the Patient (M3, include Search Availability)]</text><text x="445.0" y="518.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">m3: bookTimeSlot(timeSlot)</text><line x1="170" y1="524" x2="719.0" y2="524" stroke="#000"/><path d="M720.0 524 L710.0 520 L710.0 528 Z" fill="#000"/><path d="M80 550 H808 L820 562 V574 H80 Z" fill="#fff2cc" stroke="#d6b656"/><path d="M808 550 V562 H820" fill="none" stroke="#d6b656"/><text x="88.0" y="566.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">SO02 (M4-M8). The chosen TimeSlot becomes BOOKED and an Appointment with status BOOKED is recorded.</text><text x="445.0" y="604.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">appointment details (patient, professional, location, date and time)</text><line x1="720.0" y1="610" x2="170" y2="610" stroke="#000" stroke-dasharray="4 3"/><path d="M180 606 L170 610 L180 614" fill="none" stroke="#000"/><rect x="108" y="109" width="124" height="15" fill="#fff"/><text x="170" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" text-decoration="underline">:AdministrativeStaff</text><text x="720.0" y="69" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" text-decoration="underline">:System</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>