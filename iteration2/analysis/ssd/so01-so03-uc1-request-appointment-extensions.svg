<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="940px" height="1392px" viewBox="0 0 940 1392" xmlns:c2pa="http://c2pa.org/manifest"><rect width="100%" height="100%" fill="#fff"/><text x="30" y="34" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">SSD UC1-F: Request Appointment, extensions 1a, 2a, 3a, 4a, 5a, 5b, *a</text><line x1="170" y1="105" x2="170" y2="1377" stroke="#000" stroke-dasharray="3 3"/><circle cx="170" cy="57" r="8" fill="#fff" stroke="#000"/><line x1="170" y1="65" x2="170" y2="85" stroke="#000"/><line x1="155" y1="71" x2="185" y2="71" stroke="#000"/><path d="M155 105 L170 85 L185 105" fill="none" stroke="#000"/><rect x="635" y="45" width="170" height="40" fill="#fff" stroke="#000"/><line x1="720.0" y1="85" x2="720.0" y2="1377" stroke="#000" stroke-dasharray="3 3"/><text x="445.0" y="148.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">m1: startBooking(patientKey)</text><line x1="170" y1="154" x2="719.0" y2="154" stroke="#000"/><path d="M720.0 154 L710.0 150 L710.0 158 Z" fill="#000"/><text x="445.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">patient not found</text><line x1="720.0" y1="238" x2="170" y2="238" stroke="#000" stroke-dasharray="4 3"/><path d="M180 234 L170 238 L180 242" fill="none" stroke="#000"/><text x="445.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">m2: registerPatient(firstName, lastName, dateOfBirth, phone, insurance)</text><line x1="170" y1="278" x2="719.0" y2="278" stroke="#000"/><path d="M720.0 278 L710.0 274 L710.0 282 Z" fill="#000"/><path d="M104 304 H784 L796 316 V342 H104 Z" fill="#fff2cc" stroke="#d6b656"/><path d="M784 304 V316 H796" fill="none" stroke="#d6b656"/><text x="112.0" y="320.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">SO18 (NC3 Register Patient). insurance is optional (0..*): some patients have no RAMQ. The patient number is</text><text x="112.0" y="334.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">assigned automatically.</text><text x="445.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">patient (name, patient number)</text><line x1="720.0" y1="378" x2="170" y2="378" stroke="#000" stroke-dasharray="4 3"/><path d="M180 374 L170 378 L180 382" fill="none" stroke="#000"/><text x="445.0" y="452.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">matching patients (name, patient number)</text><line x1="720.0" y1="458" x2="170" y2="458" stroke="#000" stroke-dasharray="4 3"/><path d="M180 454 L170 458 L180 462" fill="none" stroke="#000"/><text x="445.0" y="492.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">m3: startBooking(patientNumber)</text><line x1="170" y1="498" x2="719.0" y2="498" stroke="#000"/><path d="M720.0 498 L710.0 494 L710.0 502 Z" fill="#000"/><text x="445.0" y="532.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">patient (name, patient number)</text><line x1="720.0" y1="538" x2="170" y2="538" stroke="#000" stroke-dasharray="4 3"/><path d="M180 534 L170 538 L180 542" fill="none" stroke="#000"/><rect x="90" y="180" width="720" height="384" fill="none" stroke="#000" stroke-dasharray="4 3"/><path d="M90 180 H136 V194 L130 200 H90 Z" fill="#fff" stroke="#000"/><text x="96.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold">alt</text><text x="142.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">[1a: no Patient has this phone or patient number]</text><line x1="90" y1="408" x2="810" y2="408" stroke="#000" stroke-dasharray="4 3"/><text x="98.0" y="424.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">[2a: several Patients share the phone number]</text><text x="445.0" y="586.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">m4: searchAvailability(criteria)</text><line x1="170" y1="592" x2="719.0" y2="592" stroke="#000"/><path d="M720.0 592 L710.0 588 L710.0 596 Z" fill="#000"/><text x="445.0" y="670.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">empty list</text><line x1="720.0" y1="676" x2="170" y2="676" stroke="#000" stroke-dasharray="4 3"/><path d="M180 672 L170 676 L180 680" fill="none" stroke="#000"/><path d="M104 702 H784 L796 714 V740 H104 Z" fill="#fff2cc" stroke="#d6b656"/><path d="M784 702 V714 H796" fill="none" stroke="#d6b656"/><text x="112.0" y="718.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">Staff repeats M3 with other criteria, or places the Patient on the waiting list (W1, SO27, Part A) and the use</text><text x="112.0" y="732.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">case ends.</text><text x="445.0" y="810.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">open TimeSlots</text><line x1="720.0" y1="816" x2="170" y2="816" stroke="#000" stroke-dasharray="4 3"/><path d="M180 812 L170 816 L180 820" fill="none" stroke="#000"/><rect x="90" y="618" width="720" height="224" fill="none" stroke="#000" stroke-dasharray="4 3"/><path d="M90 618 H136 V632 L130 638 H90 Z" fill="#fff" stroke="#000"/><text x="96.0" y="632.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold">alt</text><text x="142.0" y="650.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">[3a: no open TimeSlot matches]</text><line x1="90" y1="766" x2="810" y2="766" stroke="#000" stroke-dasharray="4 3"/><text x="98.0" y="782.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">[open TimeSlots found]</text><path d="M104 900 H784 L796 912 V924 H104 Z" fill="#fff2cc" stroke="#d6b656"/><path d="M784 900 V912 H796" fill="none" stroke="#d6b656"/><text x="112.0" y="916.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">R1 Inspect / Select Resources (SO33, SO34, Part A, analysis only in Iteration II).</text><rect x="90" y="856" width="720" height="90" fill="none" stroke="#000" stroke-dasharray="4 3"/><path d="M90 856 H136 V870 L130 876 H90 Z" fill="#fff" stroke="#000"/><text x="96.0" y="870.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold">opt</text><text x="142.0" y="888.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">[4a: the service needs resources]</text><text x="445.0" y="968.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">m5: bookTimeSlot(timeSlot)</text><line x1="170" y1="974" x2="719.0" y2="974" stroke="#000"/><path d="M720.0 974 L710.0 970 L710.0 978 Z" fill="#000"/><text x="445.0" y="1052.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">time slot no longer available (nothing recorded; resume at M3)</text><line x1="720.0" y1="1058" x2="170" y2="1058" stroke="#000" stroke-dasharray="4 3"/><path d="M180 1054 L170 1058 L180 1062" fill="none" stroke="#000"/><text x="445.0" y="1132.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">conflicting appointment (nothing recorded; resume at M3)</text><line x1="720.0" y1="1138" x2="170" y2="1138" stroke="#000" stroke-dasharray="4 3"/><path d="M180 1134 L170 1138 L180 1142" fill="none" stroke="#000"/><rect x="90" y="1000" width="720" height="164" fill="none" stroke="#000" stroke-dasharray="4 3"/><path d="M90 1000 H136 V1014 L130 1020 H90 Z" fill="#fff" stroke="#000"/><text x="96.0" y="1014.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold">alt</text><text x="142.0" y="1032.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">[5a: the TimeSlot was booked after it was presented]</text><line x1="90" y1="1088" x2="810" y2="1088" stroke="#000" stroke-dasharray="4 3"/><text x="98.0" y="1104.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">[5b: the Patient has an overlapping Appointment]</text><text x="445.0" y="1230.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">m6: cancelBooking()</text><line x1="170" y1="1236" x2="719.0" y2="1236" stroke="#000"/><path d="M720.0 1236 L710.0 1232 L710.0 1240 Z" fill="#000"/><path d="M104 1262 H784 L796 1274 V1286 H104 Z" fill="#fff2cc" stroke="#d6b656"/><path d="M784 1262 V1274 H796" fill="none" stroke="#d6b656"/><text x="112.0" y="1278.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">SO03. The unfinished booking is discarded. No Appointment recorded, no TimeSlot changed.</text><text x="445.0" y="1316.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">booking cancelled</text><line x1="720.0" y1="1322" x2="170" y2="1322" stroke="#000" stroke-dasharray="4 3"/><path d="M180 1318 L170 1322 L180 1326" fill="none" stroke="#000"/><rect x="90" y="1178" width="720" height="170" fill="none" stroke="#000" stroke-dasharray="4 3"/><path d="M90 1178 H136 V1192 L130 1198 H90 Z" fill="#fff" stroke="#000"/><text x="96.0" y="1192.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold">opt</text><text x="142.0" y="1210.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">[*a: the Patient changes their mind before M6]</text><rect x="108" y="109" width="124" height="15" fill="#fff"/><text x="170" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" text-decoration="underline">:AdministrativeStaff</text><text x="720.0" y="69" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" text-decoration="underline">:System</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>